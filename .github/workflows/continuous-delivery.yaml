---
name: Continuous Delivery

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main

jobs:
  xcode:
    name: Xcode
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test
        run: |
          xcodebuild -project Alertmanager.xcodeproj -scheme Alertmanager test \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS=""

      - name: Build
        run: |
          xcodebuild -project Alertmanager.xcodeproj -scheme Alertmanager -configuration Release archive -archivePath build/Alertmanager.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS=""

      - name: Compress
        run: |
          cd build/Alertmanager.xcarchive/Products/Applications/; zip -r ${GITHUB_WORKSPACE}/Alertmanager.zip Alertmanager.app

      - name: Upload Artifact
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: Alertmanager.zip
          path: Alertmanager.zip

      - name: Upload Artifact
        if: startsWith(github.event.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} Alertmanager.zip
